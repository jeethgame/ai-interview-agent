name: Deploy to AWS
on:
  push:
    branches:
      - main
      - integration/full-merge
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 975903044204.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPO: project08-backend
  ECS_CLUSTER: project08
  ECS_SERVICE: backend
  ECS_TASK_FAMILY: project08-backend
  S3_BUCKET: project08-frontend-975903044204

jobs:
  # ── Job 1: Backend checks ──────────────────────────────────────────────────
  # Runs BEFORE any Docker build or AWS call.
  # If this fails, deploy job never starts — production is never touched.
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Ruff lint
        # Catches syntax errors, unused imports, undefined variables.
        # Prevents deploying code that would crash on import.
        run: pip install ruff==0.16.10 && ruff check backend/

      - name: Pytest smoke tests
        # exit 5 = no tests collected (empty suite) — treat as pass.
        # Any other nonzero exit (failures, import errors) blocks deploy.
        run: |
          cd backend
          USE_MOCK_AUTH=true USE_MOCK_DB=true \
          pytest tests/ -x -q --ignore=tests/agents --ignore=tests/api \
            -k "not integration" --tb=short; code=$?; [ $code -eq 5 ] && exit 0 || exit $code

  # ── Job 2: Frontend checks ─────────────────────────────────────────────────
  # TypeScript compiler check — no runtime needed.
  # Catches type errors, missing props, broken imports.
  # Prevents deploying a frontend that would show a blank white screen.
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        # tsc --noEmit: compiles but writes no files — pure type check.
        # If any .tsx/.ts file has a type error, this fails and deploy stops.
        run: cd frontend && npx tsc --noEmit

  # ── Job 3: Deploy frontend (independent — runs even if backend deploy fails) ──
  deploy-frontend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and deploy frontend to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd frontend
          npm ci
          VITE_API_BASE_URL="https://api.prajeeth.tech" \
          VITE_API_WS_URL="wss://api.prajeeth.tech" \
          npm run build
          npx wrangler pages deploy dist --project-name ai-interview --commit-dirty=true

  # ── Job 4: Deploy backend (ECS) ────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPO:${{ github.sha }}"
          docker build -f Dockerfile.backend -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Update ECS task definition with new image and CORS
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition $ECS_TASK_FAMILY --query "taskDefinition" --output json)
          NEW_DEF=$(echo $TASK_DEF | jq --arg IMAGE "$IMAGE" \
            --arg CORS "http://p08-alb-1459152437.ap-south-1.elb.amazonaws.com,http://localhost:3000,http://localhost:8000,https://ai-interview-7r1.pages.dev,https://api.prajeeth.tech" '
            .containerDefinitions[0].image = $IMAGE |
            .containerDefinitions[0].environment = (
              [.containerDefinitions[0].environment[] | select(.name != "CORS_ALLOWED_ORIGINS" and .name != "USE_MOCK_AUTH")] +
              [
                {"name": "CORS_ALLOWED_ORIGINS", "value": $CORS},
                {"name": "USE_MOCK_AUTH",         "value": "false"}
              ]
            ) |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ')
          echo "$NEW_DEF" > /tmp/new-task-def.json
          aws ecs register-task-definition --cli-input-json file:///tmp/new-task-def.json

      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $ECS_TASK_FAMILY \
            --force-new-deployment
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE

      - name: Also sync frontend to S3 (backup)
        run: |
          cd frontend && npm ci
          VITE_API_BASE_URL="https://api.prajeeth.tech" \
          VITE_API_WS_URL="wss://api.prajeeth.tech" \
          npm run build
          aws s3 sync dist/ "s3://$S3_BUCKET/" --delete
