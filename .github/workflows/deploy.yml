name: Deploy to AWS
on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 975903044204.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPO: project08-backend
  ECS_CLUSTER: project08
  ECS_SERVICE: backend
  ECS_TASK_FAMILY: project08-backend
  S3_BUCKET: project08-frontend-975903044204

jobs:
  # ── Job 1: Backend checks ──────────────────────────────────────────────────
  # Runs BEFORE any Docker build or AWS call.
  # If this fails, deploy job never starts — production is never touched.
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Ruff lint
        # Catches syntax errors, unused imports, undefined variables.
        # Prevents deploying code that would crash on import.
        run: pip install ruff && ruff check backend/ --ignore E501

      - name: Pytest smoke tests
        # exit 5 = no tests collected (empty suite) — treat as pass.
        # Any other nonzero exit (failures, import errors) blocks deploy.
        run: |
          cd backend
          USE_MOCK_AUTH=true USE_MOCK_DB=true \
          pytest tests/ -x -q --ignore=tests/agents --ignore=tests/api \
            --tb=short; code=$?; [ $code -eq 5 ] && exit 0 || exit $code

  # ── Job 2: Frontend checks ─────────────────────────────────────────────────
  # TypeScript compiler check — no runtime needed.
  # Catches type errors, missing props, broken imports.
  # Prevents deploying a frontend that would show a blank white screen.
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        # tsc --noEmit: compiles but writes no files — pure type check.
        # If any .tsx/.ts file has a type error, this fails and deploy stops.
        run: cd frontend && npx tsc --noEmit

  # ── Job 3: Deploy ──────────────────────────────────────────────────────────
  # Only runs if BOTH checks above passed.
  # needs: means "wait for these jobs, fail if any failed".
  deploy:
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPO:${{ github.sha }}"
          docker build -f Dockerfile.backend -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Update ECS task definition with new image
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition $ECS_TASK_FAMILY --query "taskDefinition" --output json)
          NEW_DEF=$(echo $TASK_DEF | jq --arg IMAGE "$IMAGE" '
            .containerDefinitions[0].image = $IMAGE |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ')
          echo "$NEW_DEF" > /tmp/new-task-def.json
          aws ecs register-task-definition --cli-input-json file:///tmp/new-task-def.json

      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $ECS_TASK_FAMILY \
            --force-new-deployment
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE

      - name: Build and deploy frontend
        run: |
          cd frontend
          npm ci
          ALB_DNS=$(aws elbv2 describe-load-balancers --names p08-alb --query "LoadBalancers[0].DNSName" --output text)
          VITE_API_BASE_URL="http://$ALB_DNS" npm run build
          aws s3 sync dist/ "s3://$S3_BUCKET/" --delete
